name: Build Windows installer

# Manual on purpose. This exists so a fork can produce an installer WITHOUT a
# local Windows/Rust toolchain, and it costs minutes only when someone asks for
# a build — it is deliberately not wired to `push`, so a session of small
# commits never burns runner time.
#
# Every successful run publishes a GitHub RELEASE (that is the page with the
# download button), not just a run artifact. Two things follow from that:
#   - The version is derived from the newest release tag and bumped, so each
#     build is its own version (0.15.2, 0.15.3, …) without ever editing
#     tauri.conf.json in the repository — the tags are the counter.
#   - The tag also gives the build a name the app's own "version" line can show,
#     and it is what a future updater would have to point at.
#
# The installer is UNSIGNED (see .github/scripts/prepare-ci-config.mjs for what
# is stripped and why), so SmartScreen warns on first launch:
# "More info" → "Run anyway".
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.16.0). Leave empty to bump the newest release by one patch.'
        required: false
        default: ''

permissions:
  # Creating the release and its tag.
  contents: write

# One release at a time: two runs racing would compute the same next version and
# the second `gh release create` would fail on the tag that already exists.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Faster, but the cache below is what actually makes repeat builds cheap.
  CARGO_INCREMENTAL: 0

jobs:
  # Gate the (expensive) compile behind the cheap checks.
  check:
    name: Check (typecheck, unit tests)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run typecheck

      # Lint is reported but does not gate the installer: this is a fork of
      # upstream's tree, and a pre-existing lint complaint must not be able to
      # block a build that is only wanted to try a behaviour change.
      - run: npm run lint
        continue-on-error: true

      - run: npm run test:unit

  build:
    name: Build installer (unsigned NSIS)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Caches ~/.cargo + the workspace `target/` dir keyed on Cargo.lock, so a
      # rebuild after a frontend-only change does not recompile the world.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - run: npm ci --no-audit --no-fund

      # Version + the unsigned-bundle patch, both written into the runner's
      # throwaway checkout. `inputs.version` wins when the person dispatching
      # asked for a specific one; otherwise the newest release tag is bumped by
      # one patch, and a repository that has never released keeps the version it
      # already declares.
      - name: Resolve version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          v=""
          if [ -n "${INPUT_VERSION:-}" ]; then
            v="${INPUT_VERSION#v}"
          else
            # The newest release is the counter; a repository that has never
            # released starts from the version it declares. Either way the build
            # gets its OWN patch number, so a rebuild is never mistaken for the
            # build that came before it.
            base="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
            base="${base#v}"
            if [ -z "$base" ]; then
              base="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)"
            fi
            major="${base%%.*}"
            rest="${base#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            patch="${patch%%[+-]*}"
            v="$major.$minor.$((patch + 1))"
          fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$v' is not a plain x.y.z version"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building v$v" >> "$GITHUB_STEP_SUMMARY"
          node .github/scripts/prepare-ci-config.mjs "$v"

      - name: Build
        run: npx tauri build

      - name: List bundle output
        shell: bash
        run: ls -la target/release/bundle/nsis/

      - uses: actions/upload-artifact@v4
        with:
          name: themia-windows-installer-${{ steps.version.outputs.version }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/themia.exe
          if-no-files-found: error
          retention-days: 14

      # The tag is created HERE, not before the build: a failed compile must not
      # leave a version tag pointing at a commit with no installer behind it.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "Themia v${VERSION}" \
            --generate-notes \
            target/release/bundle/nsis/*.exe \
            target/release/themia.exe
          echo "Released: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
